<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayLater-Remind Dasbor 📈</title>
    <!-- Menghubungkan ke file CSS buatan kita sendiri -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div class="header-title">
            <h1>SMART-Remind ✨</h1>
            <p>Kelola hutangmu, amankan finansialmu via WhatsApp Bersama Kami</p>
        </div>

        <form id="formPaylater">
            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="text" id="nomorWa" placeholder="Contoh: 0812345678" required>
            </div>

            <div class="form-group">
                <label>Platform Paylater</label>
                <input type="text" id="platform" placeholder="Shopee / GoPay / Dana" required>
            </div>

            <div class="form-group">
                <label>Nominal Tagihan (Rp)</label>
                <input type="number" id="nominal" placeholder="Contoh: 150.000" required>
            </div>

            <button type="submit" class="btn-submit">
                Mulai Proteksi Finansial Anda 🚀
            </button>
        </form>
        <!-- Tambahkan ini di bawah form untuk mempermudah juri saat expo -->
        <div class="jury-info-box">
            <p><strong>💡 Panduan Live Demo Juri:</strong><br>
            Masukkan nomor WA Anda, klik tombol di atas, lalu cek pesan masuk otomatis di HP Anda secara real-time.</p>
        </div>
        
    </div> <!-- Batas penutup card-container -->
    
    <script>
        document.getElementById('formPaylater').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dataHutang = {
                nomor_wa: document.getElementById('nomorWa').value,
                nama_platform: document.getElementById('platform').value,
                nominal: document.getElementById('nominal').value
            };

            try {
                const kirimData = await fetch('http://localhost:3000/api/kirim-pengingat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataHutang)
                });
                const hasil = await kirimData.json();
                if (hasil.success) alert('Sukses mengirim simulasi WA!');
            } catch (error) {
                alert('Gagal terhubung ke server backend.');
            }
        });
    </script>
</body>
</html>
